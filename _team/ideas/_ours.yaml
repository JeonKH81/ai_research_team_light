# 우리 연구실이 내놓은 것들 — 수집에서 걸러낸다.
#
# 이것이 비어 있으면 발굴팀이 **우리가 낸 논문을 경쟁 연구로 착각해** 위협 보고를 올린다.
# 새 논문·프리프린트·저장소를 낼 때마다 여기에 한 줄 추가한다.
#
# 아래는 빈 서식이다. 주석을 지우고 자기 것을 적는다.

# 우리 프리프린트·논문의 식별자. 대소문자 구분 없이 부분일치로 본다.
dois: []
  # - "10.0000/여기에 우리가 낸 논문의 DOI를 적는다"

# 우리 저장소·등록
repos: []
  # - "github.com/여기에 우리 저장소 주소를 적는다"
registrations: []
  # - "여기에 사전등록·등록번호를 적는다 (예: PROSPERO·osf.io 주소)"

# 제목이 이것과 충분히 겹치면 우리 것으로 본다. 제목이 조금씩 바뀌어 실리기 때문이다.
titles: []
  # - "여기에 우리 논문 제목을 적는다"

# 저자명 — 초록·저자 목록에 이 이름이 있으면 우리 것일 가능성이 높다.
# 동명이인이 있을 수 있으므로 이것만으로 거르지 않고 표시만 한다.
authors: []
  # - "여기에 연구책임자의 논문 표기명을 적는다"
