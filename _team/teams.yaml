# 10개 고정 연구팀 — 이름 규칙: planets. 바꾸려면 lab.yaml 을 고치고 setup.py --apply
규칙:
- 팀은 10개로 고정한다. 프로젝트가 끝나면 같은 팀이 다음 프로젝트를 받는다.
- 팀 이름은 순서나 우선순위를 뜻하지 않는다. 우선순위는 portfolio.md에만 둔다.
- 각 팀에는 Captain 1명이 있고 연구원은 공용 풀에서 소집한다.
- '팀 호칭은 `팀이름_약어` 형태로 쓴다 (예: Terra_DEMO-SR). 프로젝트가 바뀌면 약어만 갈아끼운다.'
- 배정은 `project-intake` 가 등록부와 함께 고친다.
